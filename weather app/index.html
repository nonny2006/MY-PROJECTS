<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NONNY'S WEATHER APP</title>
    <link rel="stylesheet" href="style.css">
    <!-- IMPORT GOOGLE ICONS -->
    <link rel="stylesheet" 
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
</head>
<body>
     <main class="main_container">

        <header class="input_container">
            <input class="city_input" type="text" placeholder="Search city">
            <button class="search_btn">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
        </header>

        <section class="weather_info" style="display: none;">
            <div class="location_data_container">
                <div class="location">
                    <span class="material-symbols-outlined">
                        location_on
                        </span>
                        <h4 class="country_text">Jakarta</h4>
                </div>
                <h5 class="current_date_text regular_text">Wed, 07 Aug</h5>
            </div>

            <div class="weather_summary_container">
                <img src="assets/weather/clouds.svg" alt="clouds" class="weather_summary_img">
                <div class="weather_summary_info">
                    <h1 class="temp_txt">29 °C</h1>
                    <h1 class="condition_text regular_text">Clouds</h1>
                </div>
            </div>

            <div class="weather_conditions_container">
                <div class="conditions_item">
                    <span class="material-symbols-outlined">
                        water_drop
                    </span>
                    <div class="condition_info">
                        <h5 class="regular_text">Humidity</h5>
                        <h5 class="humidity_value_txt">55%</h5>
                    </div>
                </div>

                <div class="conditions_item">
                    <span class="material-symbols-outlined">
                        air
                    </span>
                    <div class="condition_info">
                        <h5 class="regular_text">Wind Speed</h5>
                        <h5 class="wind_value_txt">2 m/s</h5>
                    </div>
                </div>
            </div>

            <div class="forecast_items_container">
                <div class="forecast_item">
                    <h5 class="forecast_item_date">05 Aug</h5>
                    <img src="assets/weather/thunderstorm.svg" alt="thunderstorm" class="forecast_item_img">
                    <h5 class="forecast_item_temp">29 °C</h5>
                </div>

                <div class="forecast_item">
                    <h5 class="forecast_item_date">05 Aug</h5>
                    <img src="assets/weather/thunderstorm.svg" alt="thunderstorm" class="forecast_item_img">
                    <h5 class="forecast_item_temp">29 °C</h5>
                </div>

                <div class="forecast_item">
                    <h5 class="forecast_item_date">05 Aug</h5>
                    <img src="assets/weather/thunderstorm.svg" alt="thunderstorm" class="forecast_item_img">
                    <h5 class="forecast_item_temp">29 °C</h5>
                </div>

                <div class="forecast_item">
                    <h5 class="forecast_item_date">05 Aug</h5>
                    <img src="assets/weather/thunderstorm.svg" alt="thunderstorm" class="forecast_item_img">
                    <h5 class="forecast_item_temp">29 °C</h5>
                </div>
            </div>
        </section>

        <section class="search_city section_message">
            <img src="assets/message/search-city.png" alt="search-city">
            <div>
                <h1>Search City</h1>
                <h4 class="regular_txt">
                    Find out the weather conditions of the city
                </h4>
            </div>
        </section>

        <section class="not_found section_message" style="display: none;">
            <img src="assets/message/not-found.png" alt="not-found">
            <div>
                <h1>Search City</h1>
                <h4 class="regular_txt">
                    Find out the weather conditions of the city
                </h4>
            </div>
        </section>

     </main>

     <script src="script.js" defer></script>
</body>
</html>
